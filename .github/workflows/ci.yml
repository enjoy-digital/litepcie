name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Fast and slow tests in two parallel jobs: a run takes as long as the slower one.
        tests:
          - { name: "Tests",      marker: "not slow" }
          - { name: "Slow Tests", marker: "slow"     }
    name: ${{ matrix.tests.name }}
    steps:
      # Checkout Repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install Tools
      - name: Install Tools
        run: |
          sudo apt-get install -y wget build-essential tcl iverilog

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "setup.py"

      - name: Install Python dependencies
        run: |
          python3 -m pip install setuptools requests pexpect meson pytest pytest-xdist

      # Install (n)Migen / LiteX / Cores
      - name: Install LiteX
        run: |
          wget https://raw.githubusercontent.com/enjoy-digital/litex/master/litex_setup.py
          python3 litex_setup.py --clone-depth=1 init install --user

      # Install Project
      - name: Install Project
        run: python3 setup.py develop --user

      # Test (in parallel on the cores of the runner, slowest tests listed for follow-up)
      - name: Run ${{ matrix.tests.name }}
        run: python3 -m pytest -v -n auto --durations=15 -m "${{ matrix.tests.marker }}"
